def additionalAlgorithms = [
	'breadthFirstSearch': 'com.example.demo.graphs.BreadthFirstSearchApplication',
	'depthFirstSearch': 'com.example.demo.graphs.DepthFirstSearchApplication',
	'bellmanFord': 'com.example.demo.graphs.BellmanFordApplication',
	'floydWarshall': 'com.example.demo.graphs.FloydWarshallApplication',
	'topologicalSort': 'com.example.demo.graphs.TopologicalSortApplication',
	'sieveOfEratosthenes': 'com.example.demo.math.SieveOfEratosthenesApplication',
	'euclideanGcd': 'com.example.demo.math.EuclideanGcdApplication',
	'fibonacci': 'com.example.demo.dynamic.FibonacciApplication',
	'knapsack': 'com.example.demo.dynamic.KnapsackApplication',
	'longestCommonSubsequence': 'com.example.demo.dynamic.LongestCommonSubsequenceApplication',
	'coinChange': 'com.example.demo.dynamic.CoinChangeApplication',
	'activitySelection': 'com.example.demo.greedy.ActivitySelectionApplication',
	'huffmanCoding': 'com.example.demo.greedy.HuffmanCodingApplication',
	'unionFind': 'com.example.demo.data_structures.UnionFindApplication',
	'binarySearchTree': 'com.example.demo.data_structures.BinarySearchTreeApplication',
	'hashTable': 'com.example.demo.data_structures.HashTableApplication',
	'trie': 'com.example.demo.data_structures.TrieApplication',
	'stack': 'com.example.demo.data_structures.StackApplication',
	'queue': 'com.example.demo.data_structures.QueueApplication',
	'kMeans': 'com.example.demo.clustering.KMeansApplication'
]

additionalAlgorithms.each { taskName, className ->
	tasks.register("run${taskName.capitalize()}", JavaExec) {
		group = 'application'
		description = "Run the interactive ${className.substring(className.lastIndexOf('.') + 1)} demonstration"
		classpath = sourceSets.main.runtimeClasspath
		mainClass = className
	}
}

tasks.named('test') {
	useJUnitPlatform()
}
